    <style>
        /* Styles personnalisés - Mobile First */
        :root {
            --primary-color: #4f46e5;
            --primary-dark: #4338ca;
            --text-light: #f8fafc;
            --text-dark: #1e293b;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        .splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        /* Layout principal */
        .main-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Filtres */
        .filter-container {
            position: sticky;
            top: 0;
            z-index: 40;
            background-color: var(--bg-dark);
            padding: 1rem 0.5rem;
            border-bottom: 1px solid #334155;
        }
        
        .filter-scroll {
            display: flex;
            overflow-x: auto;
            gap: 0.75rem;
            padding-bottom: 0.5rem;
            scrollbar-width: none;
        }
        
        .filter-scroll::-webkit-scrollbar {
            display: none;
        }
        
        .filter-btn {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s ease;
            border: 1px solid #334155;
            background-color: var(--bg-card);
            color: var(--text-light);
        }
        
        .filter-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        /* Grille des templates */
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 1rem;
            flex: 1;
        }
        
        /* Carte de template */
        .template-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        
        .template-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* Carrousel d'images */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
        }
        
        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.3s ease;
        }
        
        .carousel-slide {
            min-width: 100%;
            height: 100%;
            position: relative;
        }
        
        .carousel-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .carousel-nav {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 10;
        }
        
        .carousel-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }
        
        .carousel-dot.active {
            background-color: white;
            transform: scale(1.2);
        }
        
        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .carousel-container:hover .carousel-arrow {
            opacity: 1;
        }
        
        .carousel-arrow-left {
            left: 8px;
        }
        
        .carousel-arrow-right {
            right: 8px;
        }
        
        .slide-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* Contenu de la carte */
        .card-content {
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }
        
        .card-description {
            color: #94a3b8;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            flex: 1;
        }
        
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }
        
        .price-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .current-price {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--primary-color);
        }
        
        .old-price {
            font-size: 0.875rem;
            text-decoration: line-through;
            color: #ef4444;
        }
        
        .order-count {
            font-size: 0.875rem;
            color: #94a3b8;
        }
        
        /* Actions de la carte */
        .card-actions {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-top: 1px solid #334155;
            gap: 0.5rem;
        }
        
        .action-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            flex: 1;
            justify-content: center;
        }
        
        .like-btn {
            background-color: transparent;
            color: #94a3b8;
            flex: 0.5;
        }
        
        .like-btn.liked {
            color: #ef4444;
        }
        
        .order-btn {
            background-color: var(--primary-color);
            color: white;
            flex: 1;
        }
        
        .order-btn:hover {
            background-color: var(--primary-dark);
        }
        
        .visit-btn {
            background-color: #059669;
            color: white;
            flex: 1;
        }
        
        .visit-btn:hover {
            background-color: #047857;
        }
        
        /* Modal de commande */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 1rem;
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            color: var(--text-dark);
        }
        
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 1.25rem;
            color: #64748b;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        
        .close-modal:hover {
            background-color: #f1f5f9;
        }
        
        .modal-body {
            padding: 1.5rem;
        }
        
        .modal-carousel {
            margin-bottom: 1.5rem;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .modal-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        
        .modal-description {
            color: #64748b;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        
        .modal-section {
            margin-bottom: 1.5rem;
        }
        
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }
        
        .reasons-list {
            list-style-type: disc;
            padding-left: 1.25rem;
            color: #64748b;
        }
        
        .reasons-list li {
            margin-bottom: 0.5rem;
        }
        
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .option-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .option-checkbox {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            cursor: pointer;
        }
        
        .confirm-order-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.875rem 1rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 1rem;
        }
        
        .confirm-order-btn:hover {
            background-color: var(--primary-dark);
        }
        
        /* Compteur global */
        .total-orders {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        /* États de chargement et d'erreur */
        .image-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #333 25%, #444 25%, #444 50%, #333 50%, #333 75%, #444 75%, #444 100%);
            background-size: 40px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }
        
        .image-error {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #777;
            text-align: center;
            padding: 1rem;
        }
        
        /* Animation pour le cœur de like */
        .heart-burst {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }
        
        /* Message de filtre vide */
        .empty-filter {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            text-align: center;
            grid-column: 1 / -1;
        }
        
        .empty-filter i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.7;
        }
        
        /* Responsive Design */
        @media (max-width: 640px) {
            .templates-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
                padding: 0.75rem;
            }
            
            .carousel-container {
                height: 180px;
            }
            
            .modal-content {
                margin: 0.5rem;
            }
            
            .modal-body {
                padding: 1.25rem;
            }
            
            .card-actions {
                flex-wrap: wrap;
            }
            
            .like-btn {
                flex: 0.3;
            }
            
            .order-btn, .visit-btn {
                flex: 1;
                min-width: 45%;
            }
        }
        
        @media (min-width: 768px) {
            .templates-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .carousel-container {
                height: 220px;
            }
        }
        
        @media (min-width: 1024px) {
            .templates-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (min-width: 1280px) {
            .templates-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 2rem;
                padding: 1.5rem;
            }
        }
        
        /* Améliorations d'accessibilité */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        
        /* Focus visible pour l'accessibilité */
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }
    </style>
</head>

                </div>
                
                <button id="confirmOrder" class="confirm-order-btn">

                    "Présentation claire des fonctionnalités",

                    "Témoignages clients",
                    "Call-to-action optimisés"
                ]
            },
             {
                id: 10,
                title: "Site web pour Etablissement scolaire",
                category: "portfolio",
                price: "18 000 HTG",
                shortDescription: "Page web pro",
                images: [
                    "ecole3img1.png",
                    "ecole3img1.png",
                    "ecole3img1.png"
                ],
                demoUrl: "ecole3.html",
                likes: 19,
                orders: 6,
                reasons: [
                    "Présentation claire des fonctionnalités",
                    "Section tarifaire attractive",
                    "Témoignages clients",
                    "Call-to-action optimisés"
                ]
            }
        ];

        // Variables globales
        let currentTemplateId = null;
        let filteredTemplates = [...templates];
        let carouselStates = {};
        let currentCategory = 'all';

        // Initialisation au chargement de la page
        document.addEventListener('DOMContentLoaded', function() {
            // Initialiser les likes par défaut dans le localStorage
            templates.forEach(template => {
                if (!localStorage.getItem(`likes_${template.id}`)) {
                    localStorage.setItem(`likes_${template.id}`, template.likes);
                }
            });
            
            // Animation du splash screen
            const splashScreen = document.getElementById('splashScreen');
            const logo = splashScreen.querySelector('div');
            
            anime({
                targets: logo,
                scale: [0.8, 1.1, 1],
                rotate: [0, 5, 0],
                duration: 1500,
                easing: 'easeInOutQuad',
                complete: function() {
                    // Animation de pulsation continue
                    anime({
                        targets: logo,
                        scale: [1, 1.05, 1],
                        duration: 2000,
                        loop: true,
                        easing: 'easeInOutSine'
                    });
                }
            });
            
            // Attendre que les ressources critiques soient chargées
            window.addEventListener('load', function() {
                // Attendre un peu pour que l'animation soit visible
                setTimeout(function() {
                    // Transition vers l'interface principale
                    anime({
                        targets: splashScreen,
                        opacity: 0,
                        duration: 800,
                        easing: 'easeInOutQuad',
                        complete: function() {
                            splashScreen.classList.add('hidden');
                            document.getElementById('mainContent').classList.remove('hidden');
                            initApp();
                        }
                    });
                }, 1500);
            });
        });

        // Initialisation de l'application
        function initApp() {
            // Générer les cartes de templates
            generateTemplateCards();
            
            // Initialiser les écouteurs d'événements
            initEventListeners();
            
            // Mettre à jour le compteur global
            updateTotalOrders();
        }

        // Générer les cartes de templates
        function generateTemplateCards() {
            const container = document.getElementById('templatesGrid');
            container.innerHTML = '';
            
            // Afficher un message si aucun template ne correspond au filtre
            if (filteredTemplates.length === 0) {
                container.innerHTML = `
                    <div class="empty-filter">
                        <i class="fas fa-search"></i>
                        <h2 class="text-xl font-bold mb-2">Aucun template trouvé</h2>
                        <p class="text-gray-400">Essayez de changer de filtre pour voir plus de templates</p>
                    </div>
                `;
                return;
            }
            
            filteredTemplates.forEach(template => {
                const likes = localStorage.getItem(`likes_${template.id}`) || template.likes;
                const orders = localStorage.getItem(`orders_${template.id}`) || template.orders;
                const isLiked = localStorage.getItem(`liked_${template.id}`) === 'true';
                
                // Afficher le prix barré si disponible
                const oldPriceHtml = template.oldPrice ? 
                    `<span class="old-price">${template.oldPrice}</span>` : '';
                
                const card = document.createElement('div');
                card.className = 'template-card';
                card.dataset.id = template.id;
                card.dataset.category = template.category;
                
                card.innerHTML = `
                    <div class="carousel-container" id="carousel-${template.id}">
                        <div class="carousel-track">
                            ${template.images.map((image, index) => `
                                <div class="carousel-slide">
                                    <div class="image-container">
                                        <img 
                                            src="${image}" 
                                            alt="${template.title} - Image ${index + 1}" 
                                            class="carousel-image"
                                            loading="lazy"
                                            onerror="handleImageError(this)"
                                        >
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <div class="slide-indicator">
                            <i class="fas fa-images"></i>
                            <span>${template.images.length} images</span>
                        </div>
                        
                        <button class="carousel-arrow carousel-arrow-left" aria-label="Image précédente">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="carousel-arrow carousel-arrow-right" aria-label="Image suivante">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                        
                        <div class="carousel-nav">
                            ${template.images.map((_, index) => `
                                <div class="carousel-dot ${index === 0 ? 'active' : ''}" data-index="${index}"></div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="card-content">
                        <h3 class="card-title">${template.title}</h3>
                        <p class="card-description">${template.shortDescription}</p>
                        
                        <div class="card-footer">
                            <div class="price-container">
                                ${oldPriceHtml}
                                <span class="current-price">${template.price}</span>
                            </div>
                            <span class="order-count">${orders} commandes</span>
                        </div>
                    </div>
                    
                    <div class="card-actions">
                        <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" data-id="${template.id}">
                            <i class="fas fa-heart"></i>
                            <span>${likes}</span>
                        </button>
                        <button class="action-btn visit-btn" data-id="${template.id}">
                            <i class="fas fa-external-link-alt"></i>
                            Visiter
                        </button>
                        <button class="action-btn order-btn" data-id="${template.id}">
                            <i class="fas fa-shopping-cart"></i>
                            Commander
                        </button>
                    </div>
                `;
                
                container.appendChild(card);
                
                // Initialiser le carrousel pour ce template
                initCarousel(template.id, template.images.length);
            });
        }

        // Gérer l'erreur de chargement d'image
        function handleImageError(img) {
            img.style.display = 'none';
            const placeholder = document.createElement('div');
            placeholder.className = 'image-error';
            placeholder.innerHTML = `
                <i class="fas fa-exclamation-triangle"></i>
                <p>Image non disponible</p>
            `;
            img.parentNode.appendChild(placeholder);
        }

        // Initialiser un carrousel
        function initCarousel(templateId, totalSlides) {
            const carousel = document.getElementById(`carousel-${templateId}`);
            if (!carousel) return;
            
            const track = carousel.querySelector('.carousel-track');
            const dots = carousel.querySelectorAll('.carousel-dot');
            const prevBtn = carousel.querySelector('.carousel-arrow-left');
            const nextBtn = carousel.querySelector('.carousel-arrow-right');
            
            // Initialiser l'état du carrousel
            carouselStates[templateId] = {
                currentSlide: 0,
                totalSlides: totalSlides
            };
            
            // Événement pour le bouton précédent
            prevBtn.addEventListener('click', () => {
                navigateCarousel(templateId, -1);
            });
            
            // Événement pour le bouton suivant
            nextBtn.addEventListener('click', () => {
                navigateCarousel(templateId, 1);
            });
            
            // Événements pour les points de navigation
            dots.forEach(dot => {
                dot.addEventListener('click', () => {
                    const slideIndex = parseInt(dot.dataset.index);
                    goToSlide(templateId, slideIndex);
                });
            });
            
            // Navigation tactile pour mobile
            let startX = 0;
            let isSwiping = false;
            
            carousel.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                isSwiping = true;
            });
            
            carousel.addEventListener('touchmove', (e) => {
                if (!isSwiping) return;
                e.preventDefault();
            });
            
            carousel.addEventListener('touchend', (e) => {
                if (!isSwiping) return;
                
                const endX = e.changedTouches[0].clientX;
                const diffX = startX - endX;
                
                // Seuil de swipe (50px)
                if (Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        // Swipe vers la gauche -> image suivante
                        navigateCarousel(templateId, 1);
                    } else {
                        // Swipe vers la droite -> image précédente
                        navigateCarousel(templateId, -1);
                    }
                }
                
                isSwiping = false;
            });
        }

        // Naviguer dans le carrousel
        function navigateCarousel(templateId, direction) {
            const state = carouselStates[templateId];
            if (!state) return;
            
            let newSlide = state.currentSlide + direction;
            
            // Gérer le débordement
            if (newSlide < 0) {
                newSlide = state.totalSlides - 1;
            } else if (newSlide >= state.totalSlides) {
                newSlide = 0;
            }
            
            goToSlide(templateId, newSlide);
        }

        // Aller à une slide spécifique
        function goToSlide(templateId, slideIndex) {
            const carousel = document.getElementById(`carousel-${templateId}`);
            if (!carousel) return;
            
            const track = carousel.querySelector('.carousel-track');
            const dots = carousel.querySelectorAll('.carousel-dot');
            
            // Mettre à jour la position du track
            track.style.transform = `translateX(-${slideIndex * 100}%)`;
            
            // Mettre à jour les points de navigation
            dots.forEach(dot => {
                const dotIndex = parseInt(dot.dataset.index);
                if (dotIndex === slideIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
            
            // Mettre à jour l'état
            carouselStates[templateId].currentSlide = slideIndex;
        }

        // Initialiser les écouteurs d'événements
        function initEventListeners() {
            // Filtres
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const category = this.dataset.category;
                    currentCategory = category;
                    filterTemplates(category);
                    
                    // Mettre à jour l'état actif des boutons
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('active');
                    });
                    
                    this.classList.add('active');
                });
            });
            
            // Boutons Like
            document.addEventListener('click', function(e) {
                if (e.target.closest('.like-btn')) {
                    const btn = e.target.closest('.like-btn');
                    const templateId = btn.dataset.id;
                    toggleLike(templateId, btn);
                }
            });
            
            // Boutons Commander
            document.addEventListener('click', function(e) {
                if (e.target.closest('.order-btn')) {
                    const btn = e.target.closest('.order-btn');
                    const templateId = btn.dataset.id;
                    openOrderModal(templateId);
                }
            });
            
            // Boutons Visiter
            document.addEventListener('click', function(e) {
                if (e.target.closest('.visit-btn')) {
                    const btn = e.target.closest('.visit-btn');
                    const templateId = btn.dataset.id;
                    visitTemplate(templateId);
                }
            });
            
            // Fermer la modal
            document.getElementById('closeModal').addEventListener('click', closeOrderModal);
            document.getElementById('orderModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeOrderModal();
                }
            });
            
            // Confirmer la commande
            document.getElementById('confirmOrder').addEventListener('click', confirmOrder);
            
            // Fermer la modal avec la touche Escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeOrderModal();
                }
            });
        }

        // Filtrer les templates par catégorie
        function filterTemplates(category) {
            if (category === 'all') {
                filteredTemplates = [...templates];
            } else {
                filteredTemplates = templates.filter(template => template.category === category);
            }
            
            // Réinitialiser les états des carrousels
            carouselStates = {};
            
            // Animation de transition
            anime({
                targets: '#templatesGrid',
                opacity: [1, 0],
                duration: 200,
                easing: 'easeInOutQuad',
                complete: function() {
                    generateTemplateCards();
                    anime({
                        targets: '#templatesGrid',
                        opacity: [0, 1],
                        duration: 300,
                        easing: 'easeInOutQuad'
                    });
                }
            });
        }

        // Basculer l'état "Like"
        function toggleLike(templateId, button) {
            const likeCount = button.querySelector('span');
            let currentLikes = parseInt(localStorage.getItem(`likes_${templateId}`) || 0);
            const heartIcon = button.querySelector('i');
            const isLiked = localStorage.getItem(`liked_${templateId}`) === 'true';
            
            // Animation du cœur
            anime({
                targets: button,
                scale: [1, 1.2, 1],
                duration: 400,
                easing: 'easeInOutQuad'
            });
            
            // Basculer l'état
            if (isLiked) {
                // Retirer le like
                currentLikes = Math.max(0, currentLikes - 1);
                button.classList.remove('liked');
                localStorage.setItem(`liked_${templateId}`, 'false');
            } else {
                // Ajouter un like
                currentLikes += 1;
                button.classList.add('liked');
                localStorage.setItem(`liked_${templateId}`, 'true');
                
                // Animation d'éclatement
                const heartBurst = document.createElement('div');
                heartBurst.className = 'heart-burst';
                heartBurst.innerHTML = '<i class="fas fa-heart text-red-500"></i>';
                button.appendChild(heartBurst);
                
                anime({
                    targets: heartBurst,
                    translateY: -30,
                    opacity: [1, 0],
                    scale: [1, 2],
                    duration: 600,
                    easing: 'easeOutQuad',
                    complete: function() {
                        heartBurst.remove();
                    }
                });
            }
            
            // Mettre à jour le compteur et le stockage
            likeCount.textContent = currentLikes;
            localStorage.setItem(`likes_${templateId}`, currentLikes);
        }

        // Visiter le template (ouvrir le site de démo)
        function visitTemplate(templateId) {
            const template = templates.find(t => t.id == templateId);
            if (!template || !template.demoUrl) return;
            
            // Ouvrir le site de démo dans un nouvel onglet
            window.open(template.demoUrl, '_blank');
        }

        // Ouvrir la modal de commande
        function openOrderModal(templateId) {
            currentTemplateId = templateId;
            
            const template = templates.find(t => t.id == templateId);
            if (!template) return;
            
            // Remplir la modal avec les données du template
            document.getElementById('modalTitle').textContent = template.title;
            document.getElementById('modalDescription').textContent = template.shortDescription;
            
            // Afficher le prix
            const modalPrice = document.getElementById('modalPrice');
            if (template.oldPrice) {
                modalPrice.innerHTML = `<span style="text-decoration: line-through; color: #ef4444; font-size: 1rem; margin-right: 0.5rem;">${template.oldPrice}</span> ${template.price}`;
            } else {
                modalPrice.textContent = template.price;
            }
            
            // Configurer le carrousel de la modal
            setupModalCarousel(template.images);
            
            // Ajouter les raisons d'achat
            const reasonsList = document.getElementById('modalReasons');
            reasonsList.innerHTML = '';
            template.reasons.forEach(reason => {
                const li = document.createElement('li');
                li.textContent = reason;
                reasonsList.appendChild(li);
            });
            
            // Réinitialiser les cases à cocher
            document.querySelectorAll('.option-checkbox').forEach(checkbox => {
                checkbox.checked = false;
            });
            
            // Afficher la modal
            document.getElementById('orderModal').classList.add('active');
            document.getElementById('orderModal').setAttribute('aria-hidden', 'false');
            
            // Empêcher le défilement du body
            document.body.style.overflow = 'hidden';
        }

        // Configurer le carrousel de la modal
        function setupModalCarousel(images) {
            const modalCarousel = document.getElementById('modalCarousel');
            const track = modalCarousel.querySelector('.carousel-track');
            const nav = modalCarousel.querySelector('.carousel-nav');
            
            // Vider le carrousel existant
            track.innerHTML = '';
            nav.innerHTML = '';
            
            // Ajouter les images au carrousel
            images.forEach((image, index) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                slide.innerHTML = `
                    <div class="image-container">
                        <img src="${image}" alt="Image ${index + 1}" class="carousel-image">
                    </div>
                `;
                track.appendChild(slide);
                
                // Ajouter un point de navigation
                const dot = document.createElement('div');
                dot.className = `carousel-dot ${index === 0 ? 'active' : ''}`;
                dot.dataset.index = index;
                nav.appendChild(dot);
            });
            
            // Initialiser le carrousel de la modal
            initModalCarousel(images.length);
        }

        // Initialiser le carrousel de la modal
        function initModalCarousel(totalSlides) {
            const modalCarousel = document.getElementById('modalCarousel').querySelector('.carousel-container');
            const track = modalCarousel.querySelector('.carousel-track');
            const dots = modalCarousel.querySelectorAll('.carousel-dot');
            const prevBtn = modalCarousel.querySelector('.carousel-arrow-left');
            const nextBtn = modalCarousel.querySelector('.carousel-arrow-right');
            
            let currentSlide = 0;
            
            // Événement pour le bouton précédent
            prevBtn.addEventListener('click', () => {
                currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
                updateModalCarousel(currentSlide, track, dots);
            });
            
            // Événement pour le bouton suivant
            nextBtn.addEventListener('click', () => {
                currentSlide = (currentSlide + 1) % totalSlides;
                updateModalCarousel(currentSlide, track, dots);
            });
            
            // Événements pour les points de navigation
            dots.forEach(dot => {
                dot.addEventListener('click', () => {
                    const slideIndex = parseInt(dot.dataset.index);
                    currentSlide = slideIndex;
                    updateModalCarousel(currentSlide, track, dots);
                });
            });
            
            // Navigation tactile pour mobile
            let startX = 0;
            let isSwiping = false;
            
            modalCarousel.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                isSwiping = true;
            });
            
            modalCarousel.addEventListener('touchmove', (e) => {
                if (!isSwiping) return;
                e.preventDefault();
            });
            
            modalCarousel.addEventListener('touchend', (e) => {
                if (!isSwiping) return;
                
                const endX = e.changedTouches[0].clientX;
                const diffX = startX - endX;
                
                // Seuil de swipe (50px)
                if (Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        // Swipe vers la gauche -> image suivante
                        currentSlide = (currentSlide + 1) % totalSlides;
                    } else {
                        // Swipe vers la droite -> image précédente
                        currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
                    }
                    updateModalCarousel(currentSlide, track, dots);
                }
                
                isSwiping = false;
            });
        }

        // Mettre à jour le carrousel de la modal
        function updateModalCarousel(slideIndex, track, dots) {
            // Mettre à jour la position du track
            track.style.transform = `translateX(-${slideIndex * 100}%)`;
            
            // Mettre à jour les points de navigation
            dots.forEach(dot => {
                const dotIndex = parseInt(dot.dataset.index);
                if (dotIndex === slideIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        // Fermer la modal de commande
        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('active');
            document.getElementById('orderModal').setAttribute('aria-hidden', 'true');
            currentTemplateId = null;
            
            // Rétablir le défilement du body
            document.body.style.overflow = '';
        }

        // Confirmer la commande
        function confirmOrder() {
            const template = templates.find(t => t.id == currentTemplateId);
            if (!template) return;
            
            // Récupérer les options sélectionnées
            const selectedOptions = [];
            document.querySelectorAll('.option-checkbox:checked').forEach(checkbox => {
                selectedOptions.push(checkbox.value);
            });
            
            // Construire le message WhatsApp
            const message = `Bonjour, je veux commander le template "${template.title}" au prix ${template.price}.${selectedOptions.length > 0 ? ` Options: ${selectedOptions.join(', ')}.` : ''}`;
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/50935601379?text=${encodedMessage}`;
            
            // Incrémenter le compteur de commandes
            const currentOrders = parseInt(localStorage.getItem(`orders_${template.id}`) || template.orders);
            localStorage.setItem(`orders_${template.id}`, currentOrders + 1);
            
            // Mettre à jour l'affichage
            const orderCountElement = document.querySelector(`[data-id="${template.id}"] .order-count`);
            if (orderCountElement) {
                orderCountElement.textContent = currentOrders + 1;
            }
            updateTotalOrders();
            
            // Fermer la modal et rediriger vers WhatsApp
            closeOrderModal();
            window.open(whatsappUrl, '_blank');
        }

        // Mettre à jour le compteur global de commandes
        function updateTotalOrders() {
            let total = 0;
            templates.forEach(template => {
                total += parseInt(localStorage.getItem(`orders_${template.id}`) || template.orders);
            });
            document.getElementById('totalOrders').textContent = total;
        }
    </script>
</body>
</html>
