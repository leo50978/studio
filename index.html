    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CDN Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CDN Anime.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <style>
        /* Styles personnalisés */
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        
        .scroll-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
        }
        
        .template-card {
            scroll-snap-align: start;
            height: 100vh;
        }
        
        .blur-load {
            filter: blur(10px);
            transition: filter 0.3s ease;
        }
        
        .blur-load.loaded {
            filter: blur(0);
        }
        
        /* Animation pour le splash screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        .splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        /* Styles pour la modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 12px;
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        
        /* Animation pour le cœur de like */
        .heart-burst {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }
        
        /* Cacher la barre de défilement */
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        /* Styles pour le carrousel d'images */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease;
            height: 100%;
        }
        
        .carousel-slide {
            min-width: 100%;
            height: 100%;
            position: relative;
        }
        
        .carousel-nav {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 20;
        }
        
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .carousel-dot.active {
            background-color: white;
            transform: scale(1.2);
        }
        
        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .carousel-container:hover .carousel-arrow {
            opacity: 1;
        }
        
        .carousel-arrow-left {
            left: 20px;
        }
        
        .carousel-arrow-right {
            right: 20px;
        }
        
        .slide-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* Styles pour les images responsives */
        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
        }
        
        .responsive-image {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        /* Styles pour le message de filtre vide */
        .empty-filter {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        .empty-filter i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.7;
        }
        
        /* Optimisations de performance */
        .template-card:not(.active) .carousel-track,
        .template-card:not(.active) .carousel-arrow,
        .template-card:not(.active) .carousel-nav {
            display: none;
        }
        
        .template-card.active .carousel-track,
        .template-card.active .carousel-arrow,
        .template-card.active .carousel-nav {
            display: flex;
        }
        
        /* Indicateur de chargement */
        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            z-index: 5;
        }
        
        /* Image de placeholder */
        .image-placeholder {
            background: linear-gradient(45deg, #333 25%, #444 25%, #444 50%, #333 50%, #333 75%, #444 75%, #444 100%);
            background-size: 40px 40px;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }
    </style>
</head>

                ]

        // Variables globales
        let currentTemplateId = null;
        let filteredTemplates = [...templates];
        let carouselStates = {}; // Stocker l'état de chaque carrousel
        let currentCategory = 'all'; // Catégorie active
        let activeTemplateCard = null; // Carte de template active

        // Initialisation au chargement de la page
        document.addEventListener('DOMContentLoaded', function() {
            // Initialiser les likes par défaut dans le localStorage
            templates.forEach(template => {
                if (!localStorage.getItem(`likes_${template.id}`)) {
                    localStorage.setItem(`likes_${template.id}`, template.likes);
                }
            });
            
            // Animation du splash screen
            const splashScreen = document.getElementById('splashScreen');
            const logo = splashScreen.querySelector('div');
            
            anime({
                targets: logo,
                scale: [0.8, 1.1, 1],
                rotate: [0, 5, 0],
                duration: 1500,
                easing: 'easeInOutQuad',
                complete: function() {
                    // Animation de pulsation continue
                    anime({
                        targets: logo,
                        scale: [1, 1.05, 1],
                        duration: 2000,
                        loop: true,
                        easing: 'easeInOutSine'
                    });
                }
            });
            
            // Attendre que les ressources critiques soient chargées
            window.addEventListener('load', function() {
                // Attendre un peu pour que l'animation soit visible
                setTimeout(function() {
                    // Transition vers l'interface principale
                    anime({
                        targets: splashScreen,
                        opacity: 0,
                        duration: 800,
                        easing: 'easeInOutQuad',
                        complete: function() {
                            splashScreen.classList.add('hidden');
                            document.getElementById('mainContent').classList.remove('hidden');
                            initApp();
                        }
                    });
                }, 1500);
            });
        });

        // Initialisation de l'application
        function initApp() {
            // Générer les cartes de templates
            generateTemplateCards();
            
            // Initialiser les écouteurs d'événements
            initEventListeners();
            
            // Initialiser l'IntersectionObserver pour le lazy loading
            initLazyLoading();
            
            // Mettre à jour le compteur global
            updateTotalOrders();
        }

        // Générer les cartes de templates
        function generateTemplateCards() {
            const container = document.getElementById('scrollContainer');
            container.innerHTML = '';
            
            // Afficher un message si aucun template ne correspond au filtre
            if (filteredTemplates.length === 0) {
                container.innerHTML = `
                    <div class="empty-filter">
                        <i class="fas fa-search"></i>
                        <h2 class="text-xl font-bold mb-2">Aucun template trouvé</h2>
                        <p class="text-gray-400">Essayez de changer de filtre pour voir plus de templates</p>
                    </div>
                `;
                return;
            }
            
            filteredTemplates.forEach(template => {
                const likes = localStorage.getItem(`likes_${template.id}`) || template.likes;
                const orders = localStorage.getItem(`orders_${template.id}`) || template.orders;
                
                const card = document.createElement('div');
                card.className = 'template-card relative';
                card.dataset.id = template.id;
                card.dataset.category = template.category;
                
                // Ne charger que la première image initialement
                card.innerHTML = `
                    <div class="relative w-full h-full">
                        <!-- Carrousel d'images -->
                        <div class="carousel-container" id="carousel-${template.id}">
                            <div class="carousel-track">
                                <div class="carousel-slide">
                                    <div class="image-container">
                                        <div class="image-placeholder">
                                            <div class="loading-indicator">
                                                <i class="fas fa-spinner fa-spin text-2xl"></i>
                                                <p class="mt-2">Chargement...</p>
                                            </div>
                                        </div>
                                        <img 
                                            data-src="${template.images[0]}" 
                                            alt="${template.title} - Image 1" 
                                            class="responsive-image blur-load hidden"
                                            loading="lazy"
                                            onload="this.classList.remove('hidden'); this.previousElementSibling.style.display='none'; this.classList.add('loaded')"
                                        >
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Indicateur de slide -->
                            <div class="slide-indicator">
                                <i class="fas fa-images"></i>
                                <span>${template.images.length} images</span>
                            </div>
                            
                            <!-- Flèches de navigation -->
                            <button class="carousel-arrow carousel-arrow-left" aria-label="Image précédente">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <button class="carousel-arrow carousel-arrow-right" aria-label="Image suivante">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                            
                            <!-- Points de navigation -->
                            <div class="carousel-nav">
                                ${template.images.map((_, index) => `
                                    <div class="carousel-dot ${index === 0 ? 'active' : ''}" data-index="${index}" aria-label="Aller à l'image ${index + 1}"></div>
                                `).join('')}
                            </div>
                        </div>
                        
                        <!-- Overlay d'informations -->
                        <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black to-transparent">
                            <h2 class="text-2xl font-bold mb-2">${template.title}</h2>
                            <p class="text-gray-300 mb-4">${template.shortDescription}</p>
                            <div class="flex justify-between items-center">
                                <span class="text-xl font-bold text-indigo-400">${template.price}</span>
                                <span class="text-gray-400" id="orderCount-${template.id}">${orders} commandes</span>
                            </div>
                        </div>
                        
                        <!-- Actions à droite (style TikTok) -->
                        <div class="absolute right-4 bottom-1/2 transform translate-y-1/2 flex flex-col items-center space-y-6">
                            <!-- Bouton Like -->
                            <div class="flex flex-col items-center">
                                <button class="like-btn w-12 h-12 bg-black bg-opacity-50 rounded-full flex items-center justify-center text-white hover:bg-opacity-70 transition-all" data-id="${template.id}" aria-label="Aimer ce template">
                                    <i class="fas fa-heart ${likes > 0 ? 'text-red-500' : 'text-white'}"></i>
                                </button>
                                <span class="text-white text-sm mt-1" id="likeCount-${template.id}">${likes}</span>
                            </div>
                            
                            <!-- Bouton Commander -->
                            <div class="flex flex-col items-center">
                                <button class="order-btn w-12 h-12 bg-black bg-opacity-50 rounded-full flex items-center justify-center text-white hover:bg-opacity-70 transition-all" data-id="${template.id}" aria-label="Commander ce template">
                                    <i class="fas fa-shopping-cart"></i>
                                </button>
                                <span class="text-white text-sm mt-1">Commander</span>
                            </div>
                            
                            <!-- Bouton Visiter le template -->
                            <div class="flex flex-col items-center">
                                <button class="visit-btn w-12 h-12 bg-black bg-opacity-50 rounded-full flex items-center justify-center text-white hover:bg-opacity-70 transition-all" data-id="${template.id}" aria-label="Visiter la démo">
                                    <i class="fas fa-external-link-alt"></i>
                                </button>
                                <span class="text-white text-sm mt-1">Visiter</span>
                            </div>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
                
                // Initialiser le carrousel pour ce template (seulement la structure)
                initCarousel(template.id, template.images.length);
            });
        }

        // Initialiser un carrousel
        function initCarousel(templateId, totalSlides) {
            const carousel = document.getElementById(`carousel-${templateId}`);
            if (!carousel) return;
            
            const track = carousel.querySelector('.carousel-track');
            const dots = carousel.querySelectorAll('.carousel-dot');
            const prevBtn = carousel.querySelector('.carousel-arrow-left');
            const nextBtn = carousel.querySelector('.carousel-arrow-right');
            
            // Initialiser l'état du carrousel
            carouselStates[templateId] = {
                currentSlide: 0,
                totalSlides: totalSlides,
                loadedSlides: new Set([0]) // Seule la première image est chargée initialement
            };
            
            // Événement pour le bouton précédent
            prevBtn.addEventListener('click', () => {
                navigateCarousel(templateId, -1);
            });
            
            // Événement pour le bouton suivant
            nextBtn.addEventListener('click', () => {
                navigateCarousel(templateId, 1);
            });
            
            // Événements pour les points de navigation
            dots.forEach(dot => {
                dot.addEventListener('click', () => {
                    const slideIndex = parseInt(dot.dataset.index);
                    goToSlide(templateId, slideIndex);
                });
            });
            
            // Navigation au clavier
            carousel.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    navigateCarousel(templateId, -1);
                } else if (e.key === 'ArrowRight') {
                    navigateCarousel(templateId, 1);
                }
            });
            
            // Rendre le carrousel focusable pour l'accessibilité
            carousel.setAttribute('tabindex', '0');
        }

        // Naviguer dans le carrousel
        function navigateCarousel(templateId, direction) {
            const state = carouselStates[templateId];
            if (!state) return;
            
            let newSlide = state.currentSlide + direction;
            
            // Gérer le débordement
            if (newSlide < 0) {
                newSlide = state.totalSlides - 1;
            } else if (newSlide >= state.totalSlides) {
                newSlide = 0;
            }
            
            goToSlide(templateId, newSlide);
        }

        // Aller à une slide spécifique
        function goToSlide(templateId, slideIndex) {
            const carousel = document.getElementById(`carousel-${templateId}`);
            if (!carousel) return;
            
            const track = carousel.querySelector('.carousel-track');
            const dots = carousel.querySelectorAll('.carousel-dot');
            
            // Charger l'image si elle n'est pas encore chargée
            const template = templates.find(t => t.id == templateId);
            if (template && !carouselStates[templateId].loadedSlides.has(slideIndex)) {
                loadSlideImage(templateId, slideIndex, template.images[slideIndex]);
                carouselStates[templateId].loadedSlides.add(slideIndex);
            }
            
            // Mettre à jour la position du track
            track.style.transform = `translateX(-${slideIndex * 100}%)`;
            
            // Mettre à jour les points de navigation
            dots.forEach(dot => {
                const dotIndex = parseInt(dot.dataset.index);
                if (dotIndex === slideIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
            
            // Mettre à jour l'état
            carouselStates[templateId].currentSlide = slideIndex;
        }

        // Charger une image de slide
        function loadSlideImage(templateId, slideIndex, imageSrc) {
            const carousel = document.getElementById(`carousel-${templateId}`);
            if (!carousel) return;
            
            const track = carousel.querySelector('.carousel-track');
            let slide = track.children[slideIndex];
            
            // Si la slide n'existe pas encore, la créer
            if (!slide) {
                slide = document.createElement('div');
                slide.className = 'carousel-slide';
                slide.innerHTML = `
                    <div class="image-container">
                        <div class="image-placeholder">
                            <div class="loading-indicator">
                                <i class="fas fa-spinner fa-spin text-2xl"></i>
                                <p class="mt-2">Chargement...</p>
                            </div>
                        </div>
                        <img 
                            data-src="${imageSrc}" 
                            alt="Image ${slideIndex + 1}" 
                            class="responsive-image blur-load hidden"
                            loading="lazy"
                            onload="this.classList.remove('hidden'); this.previousElementSibling.style.display='none'; this.classList.add('loaded')"
                        >
                    </div>
                `;
                track.appendChild(slide);
            }
            
            // Charger l'image si elle n'est pas déjà chargée
            const img = slide.querySelector('img');
            if (img && !img.src) {
                img.src = img.dataset.src;
            }
        }

        // Initialiser les écouteurs d'événements
        function initEventListeners() {
            // Filtres
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const category = this.dataset.category;
                    currentCategory = category;
                    filterTemplates(category);
                    
                    // Mettre à jour l'état actif des boutons
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('bg-white', 'text-black');
                        b.classList.add('bg-gray-800', 'text-white');
                    });
                    
                    this.classList.remove('bg-gray-800', 'text-white');
                    this.classList.add('bg-white', 'text-black');
                });
            });
            
            // Boutons Like
            document.addEventListener('click', function(e) {
                if (e.target.closest('.like-btn')) {
                    const btn = e.target.closest('.like-btn');
                    const templateId = btn.dataset.id;
                    toggleLike(templateId, btn);
                }
            });
            
            // Boutons Commander
            document.addEventListener('click', function(e) {
                if (e.target.closest('.order-btn')) {
                    const btn = e.target.closest('.order-btn');
                    const templateId = btn.dataset.id;
                    openOrderModal(templateId);
                }
            });
            
            // Boutons Visiter
            document.addEventListener('click', function(e) {
                if (e.target.closest('.visit-btn')) {
                    const btn = e.target.closest('.visit-btn');
                    const templateId = btn.dataset.id;
                    visitTemplate(templateId);
                }
            });
            
            // Fermer la modal
            document.getElementById('closeModal').addEventListener('click', closeOrderModal);
            document.getElementById('orderModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeOrderModal();
                }
            });
            
            // Confirmer la commande
            document.getElementById('confirmOrder').addEventListener('click', confirmOrder);
            
            // Fermer la modal avec la touche Escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeOrderModal();
                }
            });
            
            // Observer les changements de scroll pour activer/désactiver les carrousels
            const scrollContainer = document.getElementById('scrollContainer');
            scrollContainer.addEventListener('scroll', debounce(function() {
                updateActiveTemplateCard();
            }, 100));
        }

        // Mettre à jour la carte de template active
        function updateActiveTemplateCard() {
            const scrollContainer = document.getElementById('scrollContainer');
            const templateCards = document.querySelectorAll('.template-card');
            
            // Trouver la carte actuellement visible
            let newActiveCard = null;
            
            templateCards.forEach(card => {
                const rect = card.getBoundingClientRect();
                // Si la carte occupe au moins 50% de l'écran
                if (rect.top <= window.innerHeight / 2 && rect.bottom >= window.innerHeight / 2) {
                    newActiveCard = card;
                }
            });
            
            // Mettre à jour l'état actif
            if (newActiveCard && newActiveCard !== activeTemplateCard) {
                // Désactiver l'ancienne carte active
                if (activeTemplateCard) {
                    activeTemplateCard.classList.remove('active');
                }
                
                // Activer la nouvelle carte
                newActiveCard.classList.add('active');
                activeTemplateCard = newActiveCard;
                
                // Charger toutes les images de la carte active
                const templateId = newActiveCard.dataset.id;
                const template = templates.find(t => t.id == templateId);
                if (template) {
                    loadAllImagesForTemplate(templateId, template.images);
                }
            }
        }

        // Charger toutes les images pour un template
        function loadAllImagesForTemplate(templateId, images) {
            const carousel = document.getElementById(`carousel-${templateId}`);
            if (!carousel) return;
            
            const track = carousel.querySelector('.carousel-track');
            const state = carouselStates[templateId];
            
            // Charger toutes les images qui ne sont pas encore chargées
            images.forEach((image, index) => {
                if (!state.loadedSlides.has(index)) {
                    loadSlideImage(templateId, index, image);
                    state.loadedSlides.add(index);
                }
            });
        }

        // Initialiser le lazy loading avec IntersectionObserver
        function initLazyLoading() {
            const lazyImages = document.querySelectorAll('img[data-src]');
            
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        if (!img.src) {
                            img.src = img.dataset.src;
                        }
                        imageObserver.unobserve(img);
                    }
                });
            });
            
            lazyImages.forEach(img => imageObserver.observe(img));
        }

        // Filtrer les templates par catégorie
        function filterTemplates(category) {
            if (category === 'all') {
                filteredTemplates = [...templates];
            } else {
                filteredTemplates = templates.filter(template => template.category === category);
            }
            
            // Réinitialiser les états des carrousels
            carouselStates = {};
            activeTemplateCard = null;
            
            // Animation de transition
            anime({
                targets: '#scrollContainer',
                opacity: [1, 0],
                duration: 300,
                easing: 'easeInOutQuad',
                complete: function() {
                    generateTemplateCards();
                    initLazyLoading();
                    anime({
                        targets: '#scrollContainer',
                        opacity: [0, 1],
                        duration: 300,
                        easing: 'easeInOutQuad'
                    });
                }
            });
        }

        // Basculer l'état "Like"
        function toggleLike(templateId, button) {
            const likeCount = document.getElementById(`likeCount-${templateId}`);
            let currentLikes = parseInt(localStorage.getItem(`likes_${templateId}`) || 0);
            const heartIcon = button.querySelector('i');
            
            // Animation du cœur
            anime({
                targets: button,
                scale: [1, 1.3, 1],
                duration: 500,
                easing: 'easeInOutQuad'
            });
            
            // Créer l'effet d'éclatement de cœur
            const heartBurst = document.createElement('div');
            heartBurst.className = 'heart-burst';
            heartBurst.innerHTML = '<i class="fas fa-heart text-red-500 text-2xl"></i>';
            button.parentElement.appendChild(heartBurst);
            
            anime({
                targets: heartBurst,
                translateY: -50,
                opacity: [1, 0],
                scale: [1, 2],
                duration: 800,
                easing: 'easeOutQuad',
                complete: function() {
                    heartBurst.remove();
                }
            });
            
            // Basculer l'état
            if (heartIcon.classList.contains('text-red-500')) {
                // Retirer le like
                currentLikes = Math.max(0, currentLikes - 1);
                heartIcon.classList.remove('text-red-500');
                heartIcon.classList.add('text-white');
            } else {
                // Ajouter un like
                currentLikes += 1;
                heartIcon.classList.remove('text-white');
                heartIcon.classList.add('text-red-500');
            }
            
            // Mettre à jour le compteur et le stockage
            likeCount.textContent = currentLikes;
            localStorage.setItem(`likes_${templateId}`, currentLikes);
        }

        // Visiter le template (ouvrir le site de démo)
        function visitTemplate(templateId) {
            const template = templates.find(t => t.id == templateId);
            if (!template || !template.demoUrl) return;
            
            // Ouvrir le site de démo dans un nouvel onglet
            window.open(template.demoUrl, '_blank');
        }

        // Ouvrir la modal de commande
        function openOrderModal(templateId) {
            currentTemplateId = templateId;
            
            const template = templates.find(t => t.id == templateId);
            if (!template) return;
            
            // Remplir la modal avec les données du template
            document.getElementById('modalTitle').textContent = template.title;
            document.getElementById('modalDescription').textContent = template.shortDescription;
            document.getElementById('modalPrice').textContent = template.price;
            
            // Configurer le carrousel de la modal
            setupModalCarousel(template.images);
            
            // Ajouter les raisons d'achat
            const reasonsList = document.getElementById('modalReasons');
            reasonsList.innerHTML = '';
            template.reasons.forEach(reason => {
                const li = document.createElement('li');
                li.textContent = reason;
                reasonsList.appendChild(li);
            });
            
            // Afficher la modal
            document.getElementById('orderModal').classList.add('active');
            document.getElementById('orderModal').setAttribute('aria-hidden', 'false');
            
            // Animation d'entrée
            anime({
                targets: '.modal-content',
                scale: [0.9, 1],
                opacity: [0, 1],
                duration: 300,
                easing: 'easeOutBack'
            });
        }

        // Configurer le carrousel de la modal
        function setupModalCarousel(images) {
            const modalCarousel = document.getElementById('modalCarousel');
            const track = modalCarousel.querySelector('.carousel-track');
            const nav = modalCarousel.querySelector('.carousel-nav');
            
            // Vider le carrousel existant
            track.innerHTML = '';
            nav.innerHTML = '';
            
            // Ajouter les images au carrousel
            images.forEach((image, index) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                slide.innerHTML = `
                    <div class="image-container h-full">
                        <img src="${image}" alt="Image ${index + 1}" class="responsive-image">
                    </div>
                `;
                track.appendChild(slide);
                
                // Ajouter un point de navigation
                const dot = document.createElement('div');
                dot.className = `carousel-dot ${index === 0 ? 'active' : ''}`;
                dot.dataset.index = index;
                nav.appendChild(dot);
            });
            
            // Initialiser le carrousel de la modal
            initModalCarousel(images.length);
        }

        // Initialiser le carrousel de la modal
        function initModalCarousel(totalSlides) {
            const modalCarousel = document.getElementById('modalCarousel').querySelector('.carousel-container');
            const track = modalCarousel.querySelector('.carousel-track');
            const dots = modalCarousel.querySelectorAll('.carousel-dot');
            const prevBtn = modalCarousel.querySelector('.carousel-arrow-left');
            const nextBtn = modalCarousel.querySelector('.carousel-arrow-right');
            
            let currentSlide = 0;
            
            // Événement pour le bouton précédent
            prevBtn.addEventListener('click', () => {
                currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
                updateModalCarousel(currentSlide, track, dots);
            });
            
            // Événement pour le bouton suivant
            nextBtn.addEventListener('click', () => {
                currentSlide = (currentSlide + 1) % totalSlides;
                updateModalCarousel(currentSlide, track, dots);
            });
            
            // Événements pour les points de navigation
            dots.forEach(dot => {
                dot.addEventListener('click', () => {
                    const slideIndex = parseInt(dot.dataset.index);
                    currentSlide = slideIndex;
                    updateModalCarousel(currentSlide, track, dots);
                });
            });
        }

        // Mettre à jour le carrousel de la modal
        function updateModalCarousel(slideIndex, track, dots) {
            // Mettre à jour la position du track
            track.style.transform = `translateX(-${slideIndex * 100}%)`;
            
            // Mettre à jour les points de navigation
            dots.forEach(dot => {
                const dotIndex = parseInt(dot.dataset.index);
                if (dotIndex === slideIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        // Fermer la modal de commande
        function closeOrderModal() {
            // Animation de sortie
            anime({
                targets: '.modal-content',
                scale: [1, 0.9],
                opacity: [1, 0],
                duration: 200,
                easing: 'easeInBack',
                complete: function() {
                    document.getElementById('orderModal').classList.remove('active');
                    document.getElementById('orderModal').setAttribute('aria-hidden', 'true');
                    currentTemplateId = null;
                }
            });
        }

        // Confirmer la commande
        function confirmOrder() {
            const template = templates.find(t => t.id == currentTemplateId);
            if (!template) return;
            
            // Récupérer les options sélectionnées
            const selectedOptions = [];
            document.querySelectorAll('.option-checkbox:checked').forEach(checkbox => {
                selectedOptions.push(checkbox.value);
            });
            
            // Construire le message WhatsApp
            const message = `Bonjour, je veux commander le template [ID: ${template.id}] - "${template.title}" au prix ${template.price}. Détails / options : ${selectedOptions.join(', ') || 'Aucune option supplémentaire'}`;
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/50935601379?text=${encodedMessage}`;
            
            // Incrémenter le compteur de commandes
            const currentOrders = parseInt(localStorage.getItem(`orders_${template.id}`) || template.orders);
            localStorage.setItem(`orders_${template.id}`, currentOrders + 1);
            
            // Mettre à jour l'affichage
            const orderCountElement = document.getElementById(`orderCount-${template.id}`);
            if (orderCountElement) {
                orderCountElement.textContent = currentOrders + 1;
            }
            updateTotalOrders();
            
            // Fermer la modal et rediriger vers WhatsApp
            closeOrderModal();
            window.open(whatsappUrl, '_blank');
        }

        // Mettre à jour le compteur global de commandes
        function updateTotalOrders() {
            let total = 0;
            templates.forEach(template => {
                total += parseInt(localStorage.getItem(`orders_${template.id}`) || template.orders);
            });
            document.getElementById('totalOrders').textContent = total;
        }

        // Fonction debounce pour limiter les appels fréquents
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
    </script>
</body>
