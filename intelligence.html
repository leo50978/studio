<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test d'Intelligence</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

<body class="bg-gradient-to-br from-blue-100 to-indigo-200 min-h-screen flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-2xl mx-auto">
        <!-- Écran d'accueil -->
        <div id="welcome-screen" class="bg-white rounded-2xl shadow-xl p-6 md:p-8 fade-in">
            <div class="text-center">
                <h1 class="text-3xl md:text-4xl font-bold text-indigo-700 mb-2">Test d'Intelligence</h1>
                <p class="text-gray-600 mb-6">Découvrez votre potentiel intellectuel avec ce test de 10 questions</p>
                
                <div class="mb-8">
                    <i class="fas fa-brain text-6xl text-indigo-500 mb-4"></i>
                </div>
                
                <div class="mb-4">
                    <label for="player-name" class="block text-left text-gray-700 mb-2 font-medium">Votre nom :</label>
                    <input type="text" id="player-name" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Entrez votre nom">
                </div>
                
                <div class="mb-6">
                    <label for="whatsapp-number" class="block text-left text-gray-700 mb-2 font-medium">Votre numéro WhatsApp :</label>
                    <input type="tel" id="whatsapp-number" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Votre numéro WhatsApp">
                    <p class="text-xs text-gray-500 mt-1 text-left">Format accepté: +33 6 12 34 56 78, 06 12 34 56 78, 0612345678, etc.</p>
                </div>
                
                <button id="start-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center">
                    <i class="fas fa-play mr-2"></i> Commencer le test
                </button>
                
                <div class="mt-6 text-sm text-gray-500">
                    <p><i class="fas fa-music mr-2"></i> Musique d'ambiance activée</p>
                </div>
            </div>
        </div>
        
        <!-- Écran de questions -->
        <div id="question-screen" class="hidden bg-white rounded-2xl shadow-xl p-6 md:p-8">
            <div class="flex justify-between items-center mb-6">
                <div class="text-indigo-700 font-bold">
                    Question <span id="current-question">1</span>/10
                </div>
                <div class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-medium">
                    Score: <span id="current-score">0</span>
                </div>
            </div>
            
            <h2 id="question-text" class="text-xl md:text-2xl font-bold text-gray-800 mb-6"></h2>
            
            <div id="answers-container" class="space-y-4 mb-6">
                <!-- Les réponses seront générées dynamiquement -->
            </div>
            
            <div class="flex justify-between items-center">
                <div id="sound-control" class="text-gray-600 cursor-pointer">
                    <i class="fas fa-volume-up mr-1"></i> Son
                </div>
                <div class="text-sm text-gray-500">
                    <i class="fas fa-clock mr-1"></i> <span id="timer">0</span>s
                </div>
            </div>
        </div>
        
        <!-- Écran de résultats -->
        <div id="result-screen" class="hidden bg-white rounded-2xl shadow-xl p-6 md:p-8">
            <div class="text-center">
                <div class="mb-6">
                    <i class="fas fa-trophy text-6xl text-yellow-500 mb-4"></i>
                </div>
                
                <h1 class="text-3xl md:text-4xl font-bold text-indigo-700 mb-2">Test Terminé !</h1>
                
                <div class="bg-indigo-50 rounded-xl p-4 mb-6">
                    <p class="text-lg text-gray-700 mb-2">Félicitations <span id="player-result-name" class="font-bold text-indigo-700"></span> !</p>
                    <p class="text-2xl font-bold text-indigo-700">Votre score : <span id="final-score" class="text-3xl">0</span>/10</p>
                </div>
                
                <div id="result-message" class="text-xl font-medium mb-6 p-4 rounded-lg">
                    <!-- Le message sera généré dynamiquement -->
                </div>
                
                <div class="flex flex-col md:flex-row gap-4 justify-center">
                    <button id="share-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg transition duration-300 flex items-center justify-center">
                        <i class="fab fa-whatsapp mr-2"></i> Partager sur WhatsApp
                    </button>
                    <button id="restart-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 flex items-center justify-center">
                        <i class="fas fa-redo mr-2"></i> Recommencer
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sons -->
    <audio id="background-music" loop>
        <source src="ambient-game-67014.mp3" type="audio/mpeg">
    </audio>
    <audio id="correct-sound">
        <source src="rightanswer-95219.mp3" type="audio/mpeg">
    </audio>
    <audio id="wrong-sound">
        <source src="wrong-answer-129254.mp3" type="audio/mpeg">
    </audio>
    <audio id="completion-sound">
        <source src="winner-game-sound-404167.mp3" type="audio/mpeg">
    </audio>
<script>(function(s){s.dataset.zone='10103780',s.src='https://forfrogadiertor.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
   <script>
    // Configuration Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBBTgIhlC7Guqmgud2TS3z_Df7pyqAhi6w",
        authDomain: "projet-bcd8d.firebaseapp.com",
        projectId: "projet-bcd8d",
        storageBucket: "projet-bcd8d.firebasestorage.app",
        messagingSenderId: "20520073751",
        appId: "1:20520073751:web:819345aca686c7e7063a52",
        measurementId: "G-MLC4DPS4X0"
    };

    // Initialiser Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Variables globales
    let playerName = '';
    let whatsappNumber = '';
    let currentQuestionIndex = 0;
    let score = 0;
    let timer = 0;
    let timerInterval;
    let isSoundEnabled = true;
    let userId = null;
    
    // Questions du test
    const questions = [
        {
            question: "Combien font 15 + 27 ?",
            answers: [
                { text: "32", correct: false },
                { text: "42", correct: true },
                { text: "52", correct: false },
                { text: "62", correct: false }
            ]
        },
        {
            question: "Si un train part à 8h et arrive à 10h30, combien de temps a duré le trajet ?",
            answers: [
                { text: "1h30", correct: false },
                { text: "2h30", correct: true },
                { text: "3h", correct: false },
                { text: "2h", correct: false }
            ]
        },
        {
            question: "Quel mot ne correspond pas aux autres ?",
            answers: [
                { text: "chien", correct: false },
                { text: "chat", correct: false },
                { text: "oiseau", correct: false },
                { text: "table", correct: true }
            ]
        },
        {
            question: "Si tous les roses sont des fleurs et certaines fleurs fanent, alors :",
            answers: [
                { text: "Toutes les fleurs sont roses", correct: false },
                { text: "Certains roses peuvent faner", correct: true },
                { text: "Aucune fleur ne fane", correct: false },
                { text: "Les roses ne sont pas des fleurs", correct: false }
            ]
        },
        {
            question: "Quelle est la suite logique : 2, 4, 8, 16, … ?",
            answers: [
                { text: "32", correct: true },
                { text: "24", correct: false },
                { text: "36", correct: false },
                { text: "30", correct: false }
            ]
        },
        {
            question: "Si 5 machines fabriquent 5 objets en 5 minutes, combien de temps pour 100 machines à fabriquer 100 objets ?",
            answers: [
                { text: "100 minutes", correct: false },
                { text: "10 minutes", correct: false },
                { text: "5 minutes", correct: true },
                { text: "50 minutes", correct: false }
            ]
        },
        {
            question: "Quel mot est mal orthographié ?",
            answers: [
                { text: "Maison", correct: false },
                { text: "Ortograf", correct: true },
                { text: "Arbre", correct: false },
                { text: "Chaise", correct: false }
            ]
        },
        {
            question: "Trouve l'intrus : carré, rectangle, triangle, cercle.",
            answers: [
                { text: "carré", correct: false },
                { text: "rectangle", correct: false },
                { text: "triangle", correct: false },
                { text: "cercle", correct: true }
            ]
        },
        {
            question: "Quel nombre complète la série : 1, 1, 2, 3, 5, 8, … ?",
            answers: [
                { text: "13", correct: true },
                { text: "10", correct: false },
                { text: "11", correct: false },
                { text: "15", correct: false }
            ]
        },
        {
            question: "Quel objet utilise-t-on pour mesurer le temps ?",
            answers: [
                { text: "Boussole", correct: false },
                { text: "Montre", correct: true },
                { text: "Règle", correct: false },
                { text: "Balance", correct: false }
            ]
        }
    ];

    // Éléments DOM
    const elements = {
        welcomeScreen: document.getElementById('welcome-screen'),
        questionScreen: document.getElementById('question-screen'),
        resultScreen: document.getElementById('result-screen'),
        playerNameInput: document.getElementById('player-name'),
        whatsappNumberInput: document.getElementById('whatsapp-number'),
        startBtn: document.getElementById('start-btn'),
        currentQuestionElement: document.getElementById('current-question'),
        currentScoreElement: document.getElementById('current-score'),
        questionTextElement: document.getElementById('question-text'),
        answersContainer: document.getElementById('answers-container'),
        timerElement: document.getElementById('timer'),
        soundControl: document.getElementById('sound-control'),
        playerResultName: document.getElementById('player-result-name'),
        finalScoreElement: document.getElementById('final-score'),
        resultMessage: document.getElementById('result-message'),
        shareBtn: document.getElementById('share-btn'),
        restartBtn: document.getElementById('restart-btn')
    };

    // Sons
    const sounds = {
        backgroundMusic: document.getElementById('background-music'),
        correctSound: document.getElementById('correct-sound'),
        wrongSound: document.getElementById('wrong-sound'),
        completionSound: document.getElementById('completion-sound')
    };

    // Initialisation
    document.addEventListener('DOMContentLoaded', function() {
        initializeApp();
    });

    function initializeApp() {
        // Démarrer la musique de fond
        sounds.backgroundMusic.volume = 0.3;
        sounds.backgroundMusic.play().catch(e => console.log("Lecture automatique bloquée"));
        
        // Événements
        elements.startBtn.addEventListener('click', startQuiz);
        elements.soundControl.addEventListener('click', toggleSound);
        elements.shareBtn.addEventListener('click', shareResults);
        elements.restartBtn.addEventListener('click', restartQuiz);
        
        // Récupérer l'userId sauvegardé
        userId = localStorage.getItem('userId');
        
        // Animation de l'écran d'accueil
        animateWelcomeScreen();
    }

    function animateWelcomeScreen() {
        anime({
            targets: elements.welcomeScreen,
            scale: [0.9, 1],
            opacity: [0, 1],
            duration: 800,
            easing: 'easeOutElastic(1, .8)'
        });
    }

    // Démarrer le quiz
    async function startQuiz() {
        if (!validateForm()) return;
        
        // Sauvegarder les données utilisateur
        await saveUserData();
        
        // Transition vers l'écran de questions
        transitionToQuestionScreen();
    }

    function validateForm() {
        playerName = elements.playerNameInput.value.trim();
        whatsappNumber = elements.whatsappNumberInput.value.trim();
        
        if (!playerName) {
            animateError(elements.playerNameInput);
            return false;
        }
        
        if (!whatsappNumber) {
            animateError(elements.whatsappNumberInput);
            return false;
        }
        
        // Nettoyer le numéro
        whatsappNumber = cleanPhoneNumber(whatsappNumber);
        return true;
    }

    function animateError(element) {
        element.focus();
        anime({
            targets: element,
            translateX: [0, -10, 10, -10, 10, 0],
            duration: 500,
            easing: 'easeInOutSine'
        });
    }

    function cleanPhoneNumber(number) {
        return number.replace(/[^\d+]/g, '');
    }

    async function saveUserData() {
        const userData = {
            name: playerName,
            whatsappNumber: whatsappNumber,
            registrationDate: new Date().toISOString(),
            testStartTime: new Date().toISOString(),
            hasStartedTest: true
        };
        
        try {
            const docRef = await db.collection("users").add(userData);
            userId = docRef.id;
            localStorage.setItem('userId', userId);
            console.log("Données utilisateur sauvegardées avec ID: ", userId);
        } catch (error) {
            console.error("Erreur lors de la sauvegarde: ", error);
        }
    }

    function transitionToQuestionScreen() {
        anime({
            targets: elements.welcomeScreen,
            opacity: 0,
            scale: 0.9,
            duration: 500,
            easing: 'easeInOutQuad',
            complete: () => {
                elements.welcomeScreen.classList.add('hidden');
                elements.questionScreen.classList.remove('hidden');
                showQuestion();
                startTimer();
                
                anime({
                    targets: elements.questionScreen,
                    opacity: [0, 1],
                    scale: [0.9, 1],
                    duration: 500,
                    easing: 'easeOutQuad'
                });
            }
        });
    }

    // Afficher une question
    function showQuestion() {
        const question = questions[currentQuestionIndex];
        
        elements.currentQuestionElement.textContent = currentQuestionIndex + 1;
        elements.currentScoreElement.textContent = score;
        elements.questionTextElement.textContent = question.question;
        
        elements.answersContainer.innerHTML = '';
        
        question.answers.forEach((answer, index) => {
            createAnswerButton(answer, index);
        });
        
        animateAnswers();
    }

    function createAnswerButton(answer, index) {
        const answerButton = document.createElement('button');
        answerButton.className = 'w-full text-left p-4 bg-gray-100 hover:bg-indigo-100 border border-gray-200 rounded-lg transition duration-300 flex items-center';
        answerButton.innerHTML = `
            <span class="bg-indigo-500 text-white rounded-full w-8 h-8 flex items-center justify-center mr-3">${String.fromCharCode(65 + index)}</span>
            <span>${answer.text}</span>
        `;
        
        answerButton.addEventListener('click', () => selectAnswer(answer.correct));
        elements.answersContainer.appendChild(answerButton);
    }

    function animateAnswers() {
        anime({
            targets: elements.answersContainer.children,
            opacity: [0, 1],
            translateY: [20, 0],
            delay: anime.stagger(100),
            duration: 500,
            easing: 'easeOutQuad'
        });
    }

    // Sélectionner une réponse
    function selectAnswer(isCorrect) {
        playAnswerSound(isCorrect);
        updateScore(isCorrect);
        moveToNextQuestion();
    }

    function playAnswerSound(isCorrect) {
        if (!isSoundEnabled) return;
        
        const sound = isCorrect ? sounds.correctSound : sounds.wrongSound;
        sound.currentTime = 0;
        sound.play();
    }

    function updateScore(isCorrect) {
        if (isCorrect) {
            score++;
            elements.currentScoreElement.textContent = score;
            animateScore();
        }
    }

    function animateScore() {
        anime({
            targets: elements.currentScoreElement,
            scale: [1, 1.5, 1],
            duration: 500,
            easing: 'easeOutElastic(1, .8)'
        });
    }

    function moveToNextQuestion() {
        currentQuestionIndex++;
        
        if (currentQuestionIndex < questions.length) {
            transitionToNextQuestion();
        } else {
            finishQuiz();
        }
    }

    function transitionToNextQuestion() {
        anime({
            targets: elements.questionScreen,
            opacity: 0,
            scale: 0.9,
            duration: 400,
            easing: 'easeInOutQuad',
            complete: () => {
                showQuestion();
                anime({
                    targets: elements.questionScreen,
                    opacity: [0, 1],
                    scale: [0.9, 1],
                    duration: 400,
                    easing: 'easeOutQuad'
                });
            }
        });
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        playCompletionSound();
        saveResultsToFirebase();
        showResults();
    }

    function playCompletionSound() {
        if (isSoundEnabled) {
            sounds.completionSound.currentTime = 0;
            sounds.completionSound.play();
        }
    }

    // Sauvegarder les résultats dans Firebase
    async function saveResultsToFirebase() {
        const resultData = {
            name: playerName,
            whatsappNumber: whatsappNumber,
            score: score,
            timeSpent: timer,
            testCompletionDate: new Date().toISOString()
        };
        
        try {
            if (userId) {
                await db.collection("users").doc(userId).update(resultData);
                console.log("Résultats sauvegardés avec succès");
            } else {
                const docRef = await db.collection("testResults").add(resultData);
                console.log("Résultats sauvegardés dans testResults avec ID: ", docRef.id);
            }
        } catch (error) {
            console.error("Erreur lors de la sauvegarde: ", error);
            // Sauvegarde de secours
            try {
                const docRef = await db.collection("testResults").add(resultData);
                console.log("Sauvegarde de secours réussie avec ID: ", docRef.id);
            } catch (backupError) {
                console.error("Erreur de sauvegarde de secours: ", backupError);
            }
        }
    }

    // Afficher les résultats
    function showResults() {
        elements.playerResultName.textContent = playerName;
        elements.finalScoreElement.textContent = score;
        
        const { message, messageClass } = getResultMessage();
        elements.resultMessage.textContent = message;
        elements.resultMessage.className = `text-xl font-medium mb-6 p-4 rounded-lg ${messageClass}`;
        
        transitionToResultScreen();
    }

    function getResultMessage() {
        if (score <= 3) {
            return {
                message: `Pas grave ${playerName}, tu feras mieux la prochaine fois 😄`,
                messageClass: 'bg-blue-100 text-blue-800'
            };
        } else if (score <= 7) {
            return {
                message: `Bien joué ${playerName} ! Ton intelligence est en pleine forme 🧠`,
                messageClass: 'bg-green-100 text-green-800'
            };
        } else {
            return {
                message: `Impressionnant ${playerName} ! Ton esprit est vif et logique 🔥`,
                messageClass: 'bg-yellow-100 text-yellow-800'
            };
        }
    }

    function transitionToResultScreen() {
        anime({
            targets: elements.questionScreen,
            opacity: 0,
            scale: 0.9,
            duration: 500,
            easing: 'easeInOutQuad',
            complete: () => {
                elements.questionScreen.classList.add('hidden');
                elements.resultScreen.classList.remove('hidden');
                
                anime({
                    targets: elements.resultScreen,
                    opacity: [0, 1],
                    scale: [0.9, 1],
                    duration: 500,
                    easing: 'easeOutQuad'
                });
                
                animateFinalScore();
            }
        });
    }

    function animateFinalScore() {
        anime({
            targets: elements.finalScoreElement,
            innerHTML: [0, score],
            round: 1,
            duration: 1500,
            easing: 'easeOutExpo'
        });
    }

    // Démarrer le chronomètre
    function startTimer() {
        timer = 0;
        elements.timerElement.textContent = timer;
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timer++;
            elements.timerElement.textContent = timer;
        }, 1000);
    }

    // Activer/désactiver le son
    function toggleSound() {
        isSoundEnabled = !isSoundEnabled;
        
        if (isSoundEnabled) {
            elements.soundControl.innerHTML = '<i class="fas fa-volume-up mr-1"></i> Son';
            sounds.backgroundMusic.volume = 0.3;
            sounds.backgroundMusic.play().catch(e => console.log("Lecture automatique bloquée"));
        } else {
            elements.soundControl.innerHTML = '<i class="fas fa-volume-mute mr-1"></i> Son';
            sounds.backgroundMusic.volume = 0;
        }
    }

    // Partager les résultats sur WhatsApp
    function shareResults() {
        const shareText = `💡 J'ai obtenu ${score}/10 à un test d'intelligence ! Et toi, tu feras mieux ? 👉 Fais le test toi aussi et compare ton résultat ! vitchwebstudio.it.com/intelligence`;
        const shareUrl = `https://wa.me/?text=${encodeURIComponent(shareText)}`;
        window.open(shareUrl, '_blank');
    }

    // Redémarrer le quiz
    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        
        transitionToWelcomeScreen();
    }

    function transitionToWelcomeScreen() {
        anime({
            targets: elements.resultScreen,
            opacity: 0,
            scale: 0.9,
            duration: 500,
            easing: 'easeInOutQuad',
            complete: () => {
                elements.resultScreen.classList.add('hidden');
                elements.welcomeScreen.classList.remove('hidden');
                
                // Réinitialiser le formulaire
                elements.playerNameInput.value = '';
                elements.whatsappNumberInput.value = '';
                
                anime({
                    targets: elements.welcomeScreen,
                    opacity: [0, 1],
                    scale: [0.9, 1],
                    duration: 500,
                    easing: 'easeOutQuad'
                });
            }
        });
    }
</script>
</body>
</html>
