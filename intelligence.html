<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test d'Intelligence</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Anime.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
    <script src="https://cdn.counter.dev/script.js" data-id="31788de2-e291-439a-9a6e-f52a51e6eaff" data-utcoffset="-4"></script>
</head>
<body class="bg-gradient-to-br from-blue-100 to-indigo-200 min-h-screen flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-2xl mx-auto">
        <!-- Écran d'accueil -->
        <div id="welcome-screen" class="bg-white rounded-2xl shadow-xl p-6 md:p-8 fade-in">
            <div class="text-center">
                <h1 class="text-3xl md:text-4xl font-bold text-indigo-700 mb-2">Test d'Intelligence</h1>
                <p class="text-gray-600 mb-6">Découvrez votre potentiel intellectuel avec ce test de 10 questions</p>
                
                <div class="mb-8">
                    <i class="fas fa-brain text-6xl text-indigo-500 mb-4"></i>
                </div>
                
                <div class="mb-6">
                    <label for="player-name" class="block text-left text-gray-700 mb-2 font-medium">Votre nom :</label>
                    <input type="text" id="player-name" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Entrez votre nom">
                </div>
                
                <button id="start-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center">
                    <i class="fas fa-play mr-2"></i> Commencer le test
                </button>
                
                <div class="mt-6 text-sm text-gray-500">
                    <p><i class="fas fa-music mr-2"></i> Musique d'ambiance activée</p>
                </div>
            </div>
        </div>
        
        <!-- Écran de questions -->
        <div id="question-screen" class="hidden bg-white rounded-2xl shadow-xl p-6 md:p-8">
            <div class="flex justify-between items-center mb-6">
                <div class="text-indigo-700 font-bold">
                    Question <span id="current-question">1</span>/10
                </div>
                <div class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-medium">
                    Score: <span id="current-score">0</span>
                </div>
            </div>
            
            <h2 id="question-text" class="text-xl md:text-2xl font-bold text-gray-800 mb-6"></h2>
            
            <div id="answers-container" class="space-y-4 mb-6">
                <!-- Les réponses seront générées dynamiquement -->
            </div>
            
            <div class="flex justify-between items-center">
                <div id="sound-control" class="text-gray-600 cursor-pointer">
                    <i class="fas fa-volume-up mr-1"></i> Son
                </div>
                <div class="text-sm text-gray-500">
                    <i class="fas fa-clock mr-1"></i> <span id="timer">0</span>s
                </div>
            </div>
        </div>
        
        <!-- Écran de résultats -->
        <div id="result-screen" class="hidden bg-white rounded-2xl shadow-xl p-6 md:p-8">
            <div class="text-center">
                <div class="mb-6">
                    <i class="fas fa-trophy text-6xl text-yellow-500 mb-4"></i>
                </div>
                
                <h1 class="text-3xl md:text-4xl font-bold text-indigo-700 mb-2">Test Terminé !</h1>
                
                <div class="bg-indigo-50 rounded-xl p-4 mb-6">
                    <p class="text-lg text-gray-700 mb-2">Félicitations <span id="player-result-name" class="font-bold text-indigo-700"></span> !</p>
                    <p class="text-2xl font-bold text-indigo-700">Votre score : <span id="final-score" class="text-3xl">0</span>/10</p>
                </div>
                
                <div id="result-message" class="text-xl font-medium mb-6 p-4 rounded-lg">
                    <!-- Le message sera généré dynamiquement -->
                </div>
                
                <div class="flex flex-col md:flex-row gap-4 justify-center">
                    <button id="share-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg transition duration-300 flex items-center justify-center">
                        <i class="fab fa-whatsapp mr-2"></i> Partager sur WhatsApp
                    </button>
                    <button id="restart-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 flex items-center justify-center">
                        <i class="fas fa-redo mr-2"></i> Recommencer
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sons -->
    <audio id="background-music" loop>
        <source src="ambient-game-67014.mp3" type="audio/mpeg">
    </audio>
    <audio id="correct-sound">
        <source src="rightanswer-95219.mp3" type="audio/mpeg">
    </audio>
    <audio id="wrong-sound">
        <source src="wrong-answer-129254.mp3" type="audio/mpeg">
    </audio>
    <audio id="completion-sound">
        <source src="winner-game-sound-404167.mp3" type="audio/mpeg">
    </audio>
<script>(function(s){s.dataset.zone='10103780',s.src='https://forfrogadiertor.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    <script>
        // Variables globales
        let playerName = '';
        let currentQuestionIndex = 0;
        let score = 0;
        let timer = 0;
        let timerInterval;
        let isSoundEnabled = true;
        
        // Questions du test
        const questions = [
            {
                question: "Combien font 15 + 27 ?",
                answers: [
                    { text: "32", correct: false },
                    { text: "42", correct: true },
                    { text: "52", correct: false },
                    { text: "62", correct: false }
                ]
            },
            {
                question: "Si un train part à 8h et arrive à 10h30, combien de temps a duré le trajet ?",
                answers: [
                    { text: "1h30", correct: false },
                    { text: "2h30", correct: true },
                    { text: "3h", correct: false },
                    { text: "2h", correct: false }
                ]
            },
            {
                question: "Quel mot ne correspond pas aux autres ?",
                answers: [
                    { text: "chien", correct: false },
                    { text: "chat", correct: false },
                    { text: "oiseau", correct: false },
                    { text: "table", correct: true }
                ]
            },
            {
                question: "Si tous les roses sont des fleurs et certaines fleurs fanent, alors :",
                answers: [
                    { text: "Toutes les fleurs sont roses", correct: false },
                    { text: "Certains roses peuvent faner", correct: true },
                    { text: "Aucune fleur ne fane", correct: false },
                    { text: "Les roses ne sont pas des fleurs", correct: false }
                ]
            },
            {
                question: "Quelle est la suite logique : 2, 4, 8, 16, … ?",
                answers: [
                    { text: "32", correct: true },
                    { text: "24", correct: false },
                    { text: "36", correct: false },
                    { text: "30", correct: false }
                ]
            },
            {
                question: "Si 5 machines fabriquent 5 objets en 5 minutes, combien de temps pour 100 machines à fabriquer 100 objets ?",
                answers: [
                    { text: "100 minutes", correct: false },
                    { text: "10 minutes", correct: false },
                    { text: "5 minutes", correct: true },
                    { text: "50 minutes", correct: false }
                ]
            },
            {
                question: "Quel mot est mal orthographié ?",
                answers: [
                    { text: "Maison", correct: false },
                    { text: "Ortograf", correct: true },
                    { text: "Arbre", correct: false },
                    { text: "Chaise", correct: false }
                ]
            },
            {
                question: "Trouve l'intrus : carré, rectangle, triangle, cercle.",
                answers: [
                    { text: "carré", correct: false },
                    { text: "rectangle", correct: false },
                    { text: "triangle", correct: false },
                    { text: "cercle", correct: true }
                ]
            },
            {
                question: "Quel nombre complète la série : 1, 1, 2, 3, 5, 8, … ?",
                answers: [
                    { text: "13", correct: true },
                    { text: "10", correct: false },
                    { text: "11", correct: false },
                    { text: "15", correct: false }
                ]
            },
            {
                question: "Quel objet utilise-t-on pour mesurer le temps ?",
                answers: [
                    { text: "Boussole", correct: false },
                    { text: "Montre", correct: true },
                    { text: "Règle", correct: false },
                    { text: "Balance", correct: false }
                ]
            }
        ];

        // Éléments DOM
        const welcomeScreen = document.getElementById('welcome-screen');
        const questionScreen = document.getElementById('question-screen');
        const resultScreen = document.getElementById('result-screen');
        const playerNameInput = document.getElementById('player-name');
        const startBtn = document.getElementById('start-btn');
        const currentQuestionElement = document.getElementById('current-question');
        const currentScoreElement = document.getElementById('current-score');
        const questionTextElement = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const timerElement = document.getElementById('timer');
        const soundControl = document.getElementById('sound-control');
        const playerResultName = document.getElementById('player-result-name');
        const finalScoreElement = document.getElementById('final-score');
        const resultMessage = document.getElementById('result-message');
        const shareBtn = document.getElementById('share-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Sons
        const backgroundMusic = document.getElementById('background-music');
        const correctSound = document.getElementById('correct-sound');
        const wrongSound = document.getElementById('wrong-sound');
        const completionSound = document.getElementById('completion-sound');

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            // Démarrer la musique de fond
            backgroundMusic.volume = 0.3;
            backgroundMusic.play().catch(e => console.log("Lecture automatique bloquée, l'utilisateur doit interagir"));
            
            // Événements
            startBtn.addEventListener('click', startQuiz);
            soundControl.addEventListener('click', toggleSound);
            shareBtn.addEventListener('click', shareResults);
            restartBtn.addEventListener('click', restartQuiz);
            
            // Animation de l'écran d'accueil
            anime({
                targets: '#welcome-screen',
                scale: [0.9, 1],
                opacity: [0, 1],
                duration: 800,
                easing: 'easeOutElastic(1, .8)'
            });
        });

        // Démarrer le quiz
        function startQuiz() {
            playerName = playerNameInput.value.trim();
            
            if (!playerName) {
                playerNameInput.focus();
                anime({
                    targets: '#player-name',
                    translateX: [0, -10, 10, -10, 10, 0],
                    duration: 500,
                    easing: 'easeInOutSine'
                });
                return;
            }
            
            // Transition entre les écrans
            anime({
                targets: welcomeScreen,
                opacity: 0,
                scale: 0.9,
                duration: 500,
                easing: 'easeInOutQuad',
                complete: function() {
                    welcomeScreen.classList.add('hidden');
                    questionScreen.classList.remove('hidden');
                    showQuestion();
                    startTimer();
                    
                    anime({
                        targets: questionScreen,
                        opacity: [0, 1],
                        scale: [0.9, 1],
                        duration: 500,
                        easing: 'easeOutQuad'
                    });
                }
            });
        }

        // Afficher une question
        function showQuestion() {
            const question = questions[currentQuestionIndex];
            
            currentQuestionElement.textContent = currentQuestionIndex + 1;
            currentScoreElement.textContent = score;
            questionTextElement.textContent = question.question;
            
            answersContainer.innerHTML = '';
            
            question.answers.forEach((answer, index) => {
                const answerButton = document.createElement('button');
                answerButton.className = 'w-full text-left p-4 bg-gray-100 hover:bg-indigo-100 border border-gray-200 rounded-lg transition duration-300 flex items-center';
                answerButton.innerHTML = `
                    <span class="bg-indigo-500 text-white rounded-full w-8 h-8 flex items-center justify-center mr-3">${String.fromCharCode(65 + index)}</span>
                    <span>${answer.text}</span>
                `;
                
                answerButton.addEventListener('click', () => selectAnswer(answer.correct));
                
                answersContainer.appendChild(answerButton);
            });
            
            // Animation des réponses
            anime({
                targets: answersContainer.children,
                opacity: [0, 1],
                translateY: [20, 0],
                delay: anime.stagger(100),
                duration: 500,
                easing: 'easeOutQuad'
            });
        }

        // Sélectionner une réponse
        function selectAnswer(isCorrect) {
            // Jouer le son de réponse
            if (isSoundEnabled) {
                if (isCorrect) {
                    correctSound.currentTime = 0;
                    correctSound.play();
                } else {
                    wrongSound.currentTime = 0;
                    wrongSound.play();
                }
            }
            
            // Mettre à jour le score
            if (isCorrect) {
                score++;
                currentScoreElement.textContent = score;
                
                // Animation de réussite
                anime({
                    targets: currentScoreElement,
                    scale: [1, 1.5, 1],
                    duration: 500,
                    easing: 'easeOutElastic(1, .8)'
                });
            }
            
            // Passer à la question suivante
            currentQuestionIndex++;
            
            if (currentQuestionIndex < questions.length) {
                // Transition vers la question suivante
                anime({
                    targets: questionScreen,
                    opacity: 0,
                    scale: 0.9,
                    duration: 400,
                    easing: 'easeInOutQuad',
                    complete: function() {
                        showQuestion();
                        
                        anime({
                            targets: questionScreen,
                            opacity: [0, 1],
                            scale: [0.9, 1],
                            duration: 400,
                            easing: 'easeOutQuad'
                        });
                    }
                });
            } else {
                // Fin du quiz
                clearInterval(timerInterval);
                
                // Jouer le son de fin
                if (isSoundEnabled) {
                    completionSound.currentTime = 0;
                    completionSound.play();
                }
                
                showResults();
            }
        }

        // Afficher les résultats
        function showResults() {
            playerResultName.textContent = playerName;
            finalScoreElement.textContent = score;
            
            // Déterminer le message en fonction du score
            let message = '';
            let messageClass = '';
            
            if (score <= 3) {
                message = `Pas grave ${playerName}, tu feras mieux la prochaine fois 😄`;
                messageClass = 'bg-blue-100 text-blue-800';
            } else if (score <= 7) {
                message = `Bien joué ${playerName} ! Ton intelligence est en pleine forme 🧠`;
                messageClass = 'bg-green-100 text-green-800';
            } else {
                message = `Impressionnant ${playerName} ! Ton esprit est vif et logique 🔥`;
                messageClass = 'bg-yellow-100 text-yellow-800';
            }
            
            resultMessage.textContent = message;
            resultMessage.className = `text-xl font-medium mb-6 p-4 rounded-lg ${messageClass}`;
            
            // Transition vers l'écran de résultats
            anime({
                targets: questionScreen,
                opacity: 0,
                scale: 0.9,
                duration: 500,
                easing: 'easeInOutQuad',
                complete: function() {
                    questionScreen.classList.add('hidden');
                    resultScreen.classList.remove('hidden');
                    
                    anime({
                        targets: resultScreen,
                        opacity: [0, 1],
                        scale: [0.9, 1],
                        duration: 500,
                        easing: 'easeOutQuad'
                    });
                    
                    // Animation du score
                    anime({
                        targets: finalScoreElement,
                        innerHTML: [0, score],
                        round: 1,
                        duration: 1500,
                        easing: 'easeOutExpo'
                    });
                }
            });
        }

        // Démarrer le chronomètre
        function startTimer() {
            timer = 0;
            timerElement.textContent = timer;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer++;
                timerElement.textContent = timer;
            }, 1000);
        }

        // Activer/désactiver le son
        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            
            if (isSoundEnabled) {
                soundControl.innerHTML = '<i class="fas fa-volume-up mr-1"></i> Son';
                backgroundMusic.volume = 0.3;
                backgroundMusic.play().catch(e => console.log("Lecture automatique blobloquée"));
            } else {
                soundControl.innerHTML = '<i class="fas fa-volume-mute mr-1"></i> Son';
                backgroundMusic.volume = 0;
            }
        }

        // Partager les résultats sur WhatsApp
        function shareResults() {
            const shareText = `💡 J'ai obtenu ${score}/10 à un test d'intelligence ! Et toi, tu feras mieux ? 👉 Fais le test toi aussi et compare ton résultat !`;
            const shareUrl = `https://wa.me/?text=${encodeURIComponent(shareText)}`;
            window.open(shareUrl, '_blank');
        }

        // Redémarrer le quiz
        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            
            // Transition vers l'écran d'accueil
            anime({
                targets: resultScreen,
                opacity: 0,
                scale: 0.9,
                duration: 500,
                easing: 'easeInOutQuad',
                complete: function() {
                    resultScreen.classList.add('hidden');
                    welcomeScreen.classList.remove('hidden');
                    
                    // Réinitialiser le formulaire
                    playerNameInput.value = '';
                    
                    anime({
                        targets: welcomeScreen,
                        opacity: [0, 1],
                        scale: [0.9, 1],
                        duration: 500,
                        easing: 'easeOutQuad'
                    });
                }
            });
        }
    </script>
</body>
</html>
